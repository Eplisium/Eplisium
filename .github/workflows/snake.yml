name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Eplisium
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f0abfc&color_dots=%23161b22,%234c1d95,%237c3aed,%23a78bfa,%23ddd6fe
            dist/github-contribution-grid-snake.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%23ddd6fe,%23a78bfa,%237c3aed,%234c1d95

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
